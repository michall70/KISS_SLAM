# KISS-SLAM 手搓版配置文件（分类风格对齐官方 kiss-icp config.yml）
data:
  max_range: 10.0        # 裁剪: 超过此距离的点丢弃
  min_range: 0.0          # 裁剪: 低于此距离的点丢弃
  deskew: false            # 是否做运动补偿(KITTI无逐点时间戳则跳过)
  data_dir: /media/michall/学习资料/Michall/datasets/2D_to_depth/seq0/pointcloud
  timestamps_start_file: null
  timestamps_end_file: null
  max_files: null           # 最多处理帧数(null=全部)
  skip_rate: 2            # 抽帧: 每 skip_rate 帧取 1 帧

mapping:
  voxel_size: 0.1         # 体素大小(米)
  max_distance: 30.0      # 局部地图保留半径: 离车超过此距离的点被移除

registration:
  max_epoch: 8           # ICP 最大迭代轮数

adaptive_threshold:
  alpha: 0.4              # EMA 平滑系数(越大反应越快)
  min_motion_th: 0.05     # 阈值下限(米), 防止静止时归零
  initial_threshold: 0.5  # 初始阈值(米)
